<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hydrate Risk Calculator</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8;
    margin: 0; padding: 20px;
    color: #333;
  }
  h1 {
    text-align: center;
    color: #0275d8;
  }
  .container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
    padding: 30px;
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
  }
  input[type="number"], select {
    width: 100%;
    padding: 8px 10px;
    margin-top: 5px;
    border: 1.5px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    margin-top: 25px;
    width: 100%;
    padding: 12px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background-color: #0275d8;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #025aa5;
  }
  .result {
    margin-top: 25px;
    background-color: #e7f1ff;
    padding: 15px;
    border-radius: 6px;
    font-size: 18px;
    font-weight: 600;
    color: #014f86;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Hydrate Risk Calculator</h1>
  
  <label for="temperature">Temperature (Kelvin, K):</label>
  <input type="number" id="temperature" placeholder="e.g. 280" min="200" max="400" step="any" />

  <label for="pressure">Pressure (kPa):</label>
  <input type="number" id="pressure" placeholder="e.g. 5000" min="1" step="any" />

  <label for="gas_type">Select Gas Type:</label>
  <select id="gas_type" onchange="updateConstants()">
    <option value="None">-- Select Gas Type --</option>
    <option value="Methane">Methane</option>
    <option value="Ethane">Ethane</option>
    <option value="Propane">Propane</option>
    <option value="Custom">Custom A and B</option>
  </select>

  <label for="constantA">Constant A:</label>
  <input type="number" id="constantA" placeholder="Enter constant A" step="any" />

  <label for="constantB">Constant B:</label>
  <input type="number" id="constantB" placeholder="Enter constant B" step="any" />

  <button onclick="calculateRisk()">Calculate Risk</button>

  <div id="result" class="result"></div>
</div>

<script>
  // Predefined constants for gases (example values)
  const gasConstants = {
    Methane: { A: 3000, B: 8 },
    Ethane: { A: 3500, B: 7.5 },
    Propane: { A: 4000, B: 7 }
  };

  function updateConstants() {
    const gas = document.getElementById("gas_type").value;
    if (gas in gasConstants) {
      document.getElementById("constantA").value = gasConstants[gas].A;
      document.getElementById("constantB").value = gasConstants[gas].B;
      document.getElementById("constantA").disabled = true;
      document.getElementById("constantB").disabled = true;
    } else if (gas === "Custom") {
      document.getElementById("constantA").value = "";
      document.getElementById("constantB").value = "";
      document.getElementById("constantA").disabled = false;
      document.getElementById("constantB").disabled = false;
    } else {
      document.getElementById("constantA").value = "";
      document.getElementById("constantB").value = "";
      document.getElementById("constantA").disabled = true;
      document.getElementById("constantB").disabled = true;
    }
  }

  function calculateRisk() {
    const T = parseFloat(document.getElementById("temperature").value);
    const P = parseFloat(document.getElementById("pressure").value);
    const A = parseFloat(document.getElementById("constantA").value);
    const B = parseFloat(document.getElementById("constantB").value);

    if (isNaN(T) || isNaN(P) || isNaN(A) || isNaN(B)) {
      alert("Please enter valid numerical values for all fields.");
      return;
    }

    if (T <= 0 || P <= 0) {
      alert("Temperature and Pressure must be positive numbers.");
      return;
    }

    // Calculate risk R = (P / e^(A/T - B)) - 1
    const expTerm = Math.exp(A / T - B);
    const R = (P / expTerm) - 1;

    // Convert to percentage
    const riskPercentage = R * 100;

    // Display results
    const resultDiv = document.getElementById("result");
    let message = `Risk Score (R): ${R.toFixed(4)}<br/>Risk Percentage: ${riskPercentage.toFixed(2)}%<br/>`;

    if (R > 0) {
      message += "<strong>Warning:</strong> High risk of hydrate formation!";
    } else {
      message += "No risk of hydrate formation detected.";
    }

    resultDiv.innerHTML = message;
  }

  // Initialize form
  updateConstants();
</script>

</body>
</html>
