<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hydrate Risk Calculator</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f7f9;
    color: #333;
    margin: 0; padding: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .container {
    background: white;
    margin: 40px;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    max-width: 400px;
    width: 100%;
  }
  h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #004a99;
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    margin-top: 6px;
    border-radius: 5px;
    border: 1.5px solid #ccc;
    font-size: 1rem;
    transition: border-color 0.3s ease;
  }
  select:focus, input[type="number"]:focus {
    border-color: #004a99;
    outline: none;
  }
  button {
    margin-top: 25px;
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    background-color: #004a99;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #003366;
  }
  #result {
    margin-top: 25px;
    padding: 15px;
    background: #e9f1fb;
    border-radius: 7px;
    font-size: 1.1rem;
  }
  #result strong {
    color: #004a99;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Hydrate Risk Calculator</h1>

    <label for="gas_type">Gas Type</label>
    <select id="gas_type">
      <option value="Natural Gas">Natural Gas</option>
      <option value="Methane">Methane</option>
      <option value="Ethane">Ethane</option>
      <option value="Propane">Propane</option>
      <option value="Butane">Butane</option>
      <option value="Other">Other</option>
    </select>

    <label for="temperature">Temperature (Kelvin, K)</label>
    <input type="number" id="temperature" placeholder="e.g. 273.15" step="any" min="0" />

    <label for="pressure">Pressure (kPa)</label>
    <input type="number" id="pressure" placeholder="e.g. 1000" step="any" min="0" />

    <label for="constantA">Constant A</label>
    <input type="number" id="constantA" placeholder="e.g. 13.521" step="any" />

    <label for="constantB">Constant B</label>
    <input type="number" id="constantB" placeholder="e.g. 2716" step="any" />

    <button onclick="calculateRisk()">Calculate Risk</button>

    <div id="result"></div>
  </div>

<script>
function calculateRisk() {
  const T = parseFloat(document.getElementById("temperature").value);
  const P_kPa = parseFloat(document.getElementById("pressure").value);
  const A = parseFloat(document.getElementById("constantA").value);
  const B = parseFloat(document.getElementById("constantB").value);
  const gas = document.getElementById("gas_type").value;

  if (isNaN(T) || isNaN(P_kPa) || isNaN(A) || isNaN(B)) {
    alert("Please enter valid numerical values for all fields.");
    return;
  }
  if (T <= 0 || P_kPa <= 0) {
    alert("Temperature and Pressure must be positive numbers.");
    return;
  }

  // Convert pressure from kPa to bar (1 bar = 100 kPa)
  const P = P_kPa / 100;

  // Calculate critical temperature for given pressure P
  const log10P = Math.log10(P);
  if (A - log10P === 0) {
    alert("Division by zero in critical temperature calculation. Check input values.");
    return;
  }
  const T_crit = B / (A - log10P);

  // Calculate critical pressure for given temperature T
  const P_crit = Math.pow(10, (A - (B / T)));

  // Calculate risk score R = |T_crit - T| + |P - P_crit|
  const R = Math.abs(T_crit - T) + Math.abs(P - P_crit);

  // Format result message
  let message = `<strong>Gas Type:</strong> ${gas}<br>`;
  message += `<strong>Critical Temperature (K):</strong> ${T_crit.toFixed(2)}<br>`;
  message += `<strong>Critical Pressure (bar):</strong> ${P_crit.toFixed(2)}<br>`;
  message += `<strong>Risk Score (R):</strong> ${R.toFixed(4)}<br>`;

  // Simple interpretation threshold
  if (R < 1) {
    message += `<span style="color:green;font-weight:bold;">Low risk of hydrate formation.</span>`;
  } else if (R < 5) {
    message += `<span style="color:orange;font-weight:bold;">Moderate risk of hydrate formation.</span>`;
  } else {
    message += `<span style="color:red;font-weight:bold;">High risk of hydrate formation!</span>`;
  }

  document.getElementById("result").innerHTML = message;
}
</script>
</body>
</html>
