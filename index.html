<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hydrate Formation Risk Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      padding: 30px;
    }
    h2 {
      color: #333;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input {
      padding: 8px;
      width: 300px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007acc;
      color: white;
      border: none;
      cursor: pointer;
    }
    .output {
      margin-top: 25px;
      padding: 15px;
      background: white;
      border: 1px solid #ccc;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <h2>Hydrate Formation Risk Calculator</h2>

  <label for="temperature">Temperature (K):</label>
  <input type="number" id="temperature" step="any" placeholder="e.g., 273.15">

  <label for="pressure">Pressure (kPa):</label>
  <input type="number" id="pressure" step="any" placeholder="e.g., 5000">

  <label for="constantA">Constant A:</label>
  <input type="number" id="constantA" step="any" placeholder="e.g., 1000">

  <label for="constantB">Constant B:</label>
  <input type="number" id="constantB" step="any" placeholder="e.g., 500">

  <button onclick="calculateRisk()">Calculate Risk</button>

  <div class="output" id="result"></div>
  <div class="output" id="resultPercentage"></div>
  <div class="output" id="suggestions"></div>
  <div class="output" id="formulas"></div>

  <script>
    function calculateRisk() {
      const T = parseFloat(document.getElementById("temperature").value);
      const P_kPa = parseFloat(document.getElementById("pressure").value);
      const A = parseFloat(document.getElementById("constantA").value);
      const B = parseFloat(document.getElementById("constantB").value);

      if (isNaN(T) || isNaN(P_kPa) || isNaN(A) || isNaN(B) || T <= 0) {
        alert("Please enter valid numerical values. Temperature must be greater than 0 K.");
        return;
      }

      // Equation: R = (P / e^((A - B) / T)) - 1
      const exponent = (A - B) / T;
      const denominator = Math.exp(exponent);
      const R = (P_kPa / denominator) - 1;

      document.getElementById("result").innerHTML = 
        `<strong>Risk of Hydrate Formation Score:</strong> ${R.toFixed(4)}`;
      document.getElementById("resultPercentage").innerHTML = 
        `<strong>Risk of Hydrate Formation Percentage:</strong> ${(R * 100).toFixed(2)}%`;

      let suggestion = "";
      if (R > 0) {
        suggestion = "⚠️ Risk of hydrate formation detected. Consider increasing temperature or decreasing pressure.";
      } else {
        suggestion = "✅ No significant hydrate formation risk.";
      }
      document.getElementById("suggestions").innerHTML = `<strong>Suggestion:</strong> ${suggestion}`;

      document.getElementById("formulas").innerHTML = `
        <strong>Equation Used:</strong><br>
        R = (P / e<sup>(A - B) / T</sup>) - 1<br>
        where:<br>
        - T = Temperature (K)<br>
        - P = Pressure (kPa)<br>
        - A, B = User-defined constants
      `;
    }
  </script>

</body>
</html>
