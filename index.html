<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advanced Hydrate Formation Risk Calculator</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
        }
        .form-section, .result-section {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .result-section h2 {
            color: #dc3545;
        }
        @media (max-width: 576px) {
            .form-section, .result-section {
                padding: 15px;
            }
            .form-group label {
                font-size: 1rem;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
    <script>
        // Gas data with enthalpy and C, but not needed now except for formulas display
        const gasData = {
            "Methane": { enthalpy: 2100, C: 1.5 },
            "Ethane": { enthalpy: 1800, C: 1.7 },
            "Propane": { enthalpy: 1600, C: 2 },
            "Butane": { enthalpy: 1500, C: 1.8 },
            "Hydrogen Sulfide": { enthalpy: 2000, C: 2.1 },
            "Carbon Dioxide": { enthalpy: 1700, C: 2.5 },
            "Mixed Gas": { enthalpy: 1750, C: 2 }
        };

        function calculateRisk() {
            const P = parseFloat(document.getElementById("pressure").value);
            const T_celsius = parseFloat(document.getElementById("temperature").value);
            const gas = getGas();
            const A = parseFloat(document.getElementById("A").value);
            const B = parseFloat(document.getElementById("B").value);

            // Convert Celsius to Kelvin
            const T = T_celsius + 273.15;

            // Validate inputs
            if (isNaN(P) || isNaN(T) || isNaN(A) || isNaN(B)) {
                alert("Please enter valid numeric values for all fields.");
                return;
            }

            // Calculate risk using given formula R = P / e^((A-B)/T) - 1
            const denominator = Math.exp((A - B) / T);
            const R = (P / denominator) - 1;

            document.getElementById("result").innerHTML = `Risk of Hydrate Formation Score: ${R.toFixed(4)}`;
            document.getElementById("resultPercentage").innerHTML = `Risk of Hydrate Formation Percentage: ${(R * 100).toFixed(2)}%`;

            // Suggestions based on risk score
            let suggestions = "";
            if (R > 0) {
                suggestions = "<strong>Suggestions:</strong><ul>";
                suggestions += "<li>Reduce pressure or increase temperature to lower hydrate risk.</li>";
                suggestions += "</ul>";
            } else {
                suggestions = "No hydrate formation risk.";
            }
            document.getElementById("suggestions").innerHTML = suggestions;

            displayFormulas();
        }

        function displayFormulas() {
            const gas = getGas();
            const clapeyronFormula = gas !== "None" 
                ? `ln(P) = (ΔH / R) * (1 / T) + C + k * P_w (Constants vary by gas type)`
                : "ln(P) = (ΔH / R) * (1 / T) + C + k * P_w";

            document.getElementById("formulas").innerHTML = ` 
                <h4>Hydrate Formation Risk Calculation:</h4>
                <p>R = P / e<sup>(A - B) / T</sup> - 1</p>
                <h4>Clausius-Clapeyron Equation with Water Content:</h4>
                <p>${clapeyronFormula}</p>
            `;
        }

        function getGas() {
            return document.getElementById("gas_type").value;
        }
    </script>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Advanced Hydrate Formation Risk Calculator</h1>
        <div class="form-section">
            <form onsubmit="event.preventDefault(); calculateRisk();">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="gas_type">Gas Type</label>
                        <select id="gas_type" class="form-control" required>
                            <option value="None">None</option>
                            <option value="Methane">Methane</option>
                            <option value="Ethane">Ethane</option>
                            <option value="Propane">Propane</option>
                            <option value="Butane">Butane</option>
                            <option value="Hydrogen Sulfide">Hydrogen Sulfide</option>
                            <option value="Carbon Dioxide">Carbon Dioxide</option>
                            <option value="Mixed Gas">Mixed Gas</option>
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="temperature">Temperature (°C)</label>
                        <input type="number" step="0.01" class="form-control" id="temperature" placeholder="e.g., 5" required />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="pressure">Pressure (MPa)</label>
                        <input type="number" step="0.01" class="form-control" id="pressure" placeholder="e.g., 1.25" required />
                    </div>
                    <div class="form-group col-md-6">
                        <label for="A">Constant A</label>
                        <input type="number" step="0.01" class="form-control" id="A" placeholder="e.g., 1000" required />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="B">Constant B</label>
                        <input type="number" step="0.01" class="form-control" id="B" placeholder="e.g., 500" required />
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Calculate Risk</button>
            </form>
        </div>

        <div class="result-section">
            <h2 id="result" class="text-center"></h2>
            <h2 id="resultPercentage" class="text-center"></h2>
            <div id="suggestions" class="mt-3"></div>
            <div id="formulas" class="mt-3"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
