<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hydrate Risk Predictor</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"/>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      max-width: 800px;
    }
    .form-section, .result-section {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    .result-section h2 {
      color: #dc3545;
    }
  </style>
  <script>
    const gasData = {
      "Methane": { T_crit: 273.15, P_crit: 1000, P_w_crit: 50, C: 1.5, enthalpy: 2100 },
      "Ethane": { T_crit: 263.15, P_crit: 2000, P_w_crit: 80, C: 1.7, enthalpy: 1800 },
      "Propane": { T_crit: 258.15, P_crit: 2500, P_w_crit: 100, C: 2.0, enthalpy: 1600 },
      "Butane": { T_crit: 253.15, P_crit: 3000, P_w_crit: 90, C: 1.8, enthalpy: 1500 },
      "Hydrogen Sulfide": { T_crit: 278.15, P_crit: 2800, P_w_crit: 70, C: 2.1, enthalpy: 2000 },
      "Carbon Dioxide": { T_crit: 243.15, P_crit: 3500, P_w_crit: 60, C: 2.5, enthalpy: 1700 },
      "Mixed Gas": { T_crit: 263.15, P_crit: 2000, P_w_crit: 80, C: 2.0, enthalpy: 1750 }
    };

    function calculateRisk() {
      const gas = document.getElementById("gas_type").value;

      const T = parseFloat(document.getElementById("temperature").value); // Kelvin
      const P = parseFloat(document.getElementById("pressure").value); // kPa
      const P_w = parseFloat(document.getElementById("water_pressure").value); // kPa

      if (isNaN(T) || isNaN(P) || isNaN(P_w)) {
        alert("Please enter valid numerical values.");
        return;
      }

      const customT_crit = parseFloat(document.getElementById("custom_T_crit").value);
      const customP_crit = parseFloat(document.getElementById("custom_P_crit").value);
      const customPw_crit = parseFloat(document.getElementById("custom_P_w_crit").value);

      const T_crit = !isNaN(customT_crit) ? customT_crit : (gas !== "None" ? gasData[gas].T_crit : 273.15);
      const P_crit = !isNaN(customP_crit) ? customP_crit : (gas !== "None" ? gasData[gas].P_crit : 1000);
      const P_w_crit = !isNaN(customPw_crit) ? customPw_crit : (gas !== "None" ? gasData[gas].P_w_crit : 50);

      const alpha = parseFloat(document.getElementById("alpha").value) || 1;
      const beta = parseFloat(document.getElementById("beta").value) || 2;
      const gamma = parseFloat(document.getElementById("gamma").value) || 3;

      const R = alpha * Math.pow(Math.abs(T_crit - T), 1.1)
              + beta * Math.pow(Math.abs(P - P_crit), 1.2)
              + gamma * Math.pow(Math.abs(P_w - P_w_crit), 1.3);

      const riskPercentage = Math.min(100, Math.max(1, (R / (R + 20)) * 100));

      document.getElementById("result").innerHTML = `Risk Score: ${R.toFixed(2)}`;
      document.getElementById("percentage").innerHTML = `Risk Percentage: ${riskPercentage.toFixed(2)}%`;

      let suggestions = "<strong>Suggestions:</strong><ul>";
      if (T < T_crit) suggestions += `<li>Increase temperature to at least ${T_crit} K.</li>`;
      if (P > P_crit) suggestions += `<li>Reduce pressure to ${P_crit} kPa or lower.</li>`;
      if (P_w > P_w_crit) suggestions += `<li>Reduce water vapor pressure to ${P_w_crit} kPa or lower.</li>`;
      suggestions += "</ul>";

      document.getElementById("suggestions").innerHTML = suggestions;

      const gasInfo = gas !== "None" ? gasData[gas] : { enthalpy: 'ΔH', C: 'C' };
      document.getElementById("formulas").innerHTML = `
        <h5>Risk Formula:</h5>
        <p>R = α * |T<sub>crit</sub> - T|<sup>1.1</sup> + β * |P - P<sub>crit</sub>|<sup>1.2</sup> + γ * |P<sub>w</sub> - P<sub>w,crit</sub>|<sup>1.3</sup></p>
        <h5>Clapeyron-Based Estimate:</h5>
        <p>ln(P) = (${gasInfo.enthalpy} / R) * (1/T) + ${gasInfo.C} + k * P<sub>w</sub></p>
      `;
    }
  </script>
</head>
<body>
  <div class="container my-4">
    <h2 class="text-center mb-4">Hydrate Formation Risk Predictor</h2>
    <div class="form-section">
      <form onsubmit="event.preventDefault(); calculateRisk();">
        <div class="form-group">
          <label for="gas_type">Gas Type</label>
          <select id="gas_type" class="form-control">
            <option value="None">None</option>
            <option value="Methane">Methane</option>
            <option value="Ethane">Ethane</option>
            <option value="Propane">Propane</option>
            <option value="Butane">Butane</option>
            <option value="Hydrogen Sulfide">Hydrogen Sulfide</option>
            <option value="Carbon Dioxide">Carbon Dioxide</option>
            <option value="Mixed Gas">Mixed Gas</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group col-md-4">
            <label for="temperature">Temperature (K)</label>
            <input type="number" id="temperature" class="form-control" placeholder="e.g., 273.15" required />
          </div>
          <div class="form-group col-md-4">
            <label for="pressure">Pressure (kPa)</label>
            <input type="number" id="pressure" class="form-control" placeholder="e.g., 1500" required />
          </div>
          <div class="form-group col-md-4">
            <label for="water_pressure">Water Vapor Pressure (kPa)</label>
            <input type="number" id="water_pressure" class="form-control" placeholder="e.g., 80" required />
          </div>
        </div>

        <div class="form-group">
          <label>Optional Custom Critical Values</label>
          <div class="form-row">
            <div class="form-group col-md-4">
              <input type="number" class="form-control" id="custom_T_crit" placeholder="T_crit (K)">
            </div>
            <div class="form-group col-md-4">
              <input type="number" class="form-control" id="custom_P_crit" placeholder="P_crit (kPa)">
            </div>
            <div class="form-group col-md-4">
              <input type="number" class="form-control" id="custom_P_w_crit" placeholder="P_w_crit (kPa)">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Weighting Coefficients</label>
          <div class="form-row">
            <div class="form-group col-md-4">
              <input type="number" class="form-control" id="alpha" placeholder="Alpha (default: 1)">
            </div>
            <div class="form-group col-md-4">
              <input type="number" class="form-control" id="beta" placeholder="Beta (default: 2)">
            </div>
            <div class="form-group col-md-4">
              <input type="number" class="form-control" id="gamma" placeholder="Gamma (default: 3)">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-danger btn-block">Calculate Risk</button>
      </form>
    </div>

    <div class="result-section">
      <h4 id="result"></h4>
      <h5 id="percentage"></h5>
      <div id="suggestions" class="mb-3"></div>
      <div id="formulas"></div>
    </div>
  </div>
</body>
</html>
