<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hydrate Risk Calculator</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8;
    padding: 20px;
    color: #333;
  }
  h1 {
    text-align: center;
    color: #004a99;
  }
  table {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 0 10px rgb(0 0 0 / 0.1);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 12px 15px;
    text-align: center;
    border-bottom: 1px solid #eee;
  }
  th {
    background-color: #004a99;
    color: white;
  }
  input[type="number"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }
  select {
    width: 100%;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  #calculateBtn {
    display: block;
    margin: 30px auto;
    background-color: #0077cc;
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  #calculateBtn:hover {
    background-color: #005fa3;
  }
  #result {
    max-width: 700px;
    margin: 20px auto;
    background: white;
    padding: 15px 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgb(0 0 0 / 0.1);
    font-size: 18px;
    color: #004a99;
  }
</style>
</head>
<body>

<h1>Hydrate Risk Formation Calculator</h1>

<table>
  <thead>
    <tr>
      <th>Gas Type</th>
      <th>Temperature (K)</th>
      <th>Pressure (kPa)</th>
      <th>Constant A</th>
      <th>Constant B</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <select id="gas_type">
          <option value="Methane">Methane</option>
          <option value="Ethane">Ethane</option>
          <option value="Propane">Propane</option>
          <option value="CarbonDioxide">Carbon Dioxide</option>
          <option value="Nitrogen">Nitrogen</option>
        </select>
      </td>
      <td><input type="number" id="temperature" min="0" step="any" placeholder="e.g. 273" /></td>
      <td><input type="number" id="pressure" min="0" step="any" placeholder="e.g. 1000" /></td>
      <td><input type="number" id="constantA" step="any" placeholder="e.g. 10.0" /></td>
      <td><input type="number" id="constantB" step="any" placeholder="e.g. 2000" /></td>
    </tr>
  </tbody>
</table>

<button id="calculateBtn" onclick="calculateRisk()">Calculate Risk</button>

<div id="result"></div>

<script>
function calculateRisk() {
  const T = parseFloat(document.getElementById("temperature").value);
  const P_kPa = parseFloat(document.getElementById("pressure").value);
  const A = parseFloat(document.getElementById("constantA").value);
  const B = parseFloat(document.getElementById("constantB").value);
  const gas = document.getElementById("gas_type").value;

  if (isNaN(T) || isNaN(P_kPa) || isNaN(A) || isNaN(B)) {
    alert("Please enter valid numerical values for all fields.");
    return;
  }
  if (T <= 0 || P_kPa <= 0) {
    alert("Temperature and Pressure must be positive numbers.");
    return;
  }

  // Convert pressure from kPa to MPa
  const P = P_kPa / 1000;

  // Calculate risk score R = (P / e^(A - B/T)) - 1
  const expTerm = Math.exp(A - (B / T));
  const R = (P / expTerm) - 1;

  // Convert to percentage
  const riskPercentage = R * 100;

  let message = `<strong>Gas Type:</strong> ${gas}<br>`;
  message += `<strong>Risk Score (R):</strong> ${R.toFixed(4)}<br>`;
  message += `<strong>Risk Percentage:</strong> ${riskPercentage.toFixed(2)}%<br>`;

  if (R > 0) {
    message += `<span style="color:red;font-weight:bold;">Warning: High risk of hydrate formation!</span>`;
  } else {
    message += `<span style="color:green;font-weight:bold;">No risk of hydrate formation detected.</span>`;
  }

  document.getElementById("result").innerHTML = message;
}
</script>

</body>
</html>
