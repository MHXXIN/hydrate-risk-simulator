<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hydrate Risk Score Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      padding: 40px 20px;
      max-width: 600px;
      margin: auto;
      color: #222;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      color: #0d47a1;
      margin-bottom: 30px;
      text-shadow: 1px 1px 2px #a3c2f7;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      color: #0d47a1;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 2px solid #90caf9;
      border-radius: 6px;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      border-color: #0d47a1;
      outline: none;
      box-shadow: 0 0 8px rgba(13, 71, 161, 0.3);
    }
    select {
      cursor: pointer;
      background-color: #fff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0d47a1;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
      border-radius: 7px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(13, 71, 161, 0.4);
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #08306b;
    }
    .result {
      margin-top: 30px;
      background: #e8f0fe;
      padding: 20px 25px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(13, 71, 161, 0.15);
      font-size: 18px;
      color: #0d47a1;
    }
    .note {
      font-size: 14px;
      color: #555;
      margin-top: -15px;
      margin-bottom: 25px;
      font-style: italic;
      user-select: none;
    }
  </style>
</head>
<body>

  <h1>Hydrate Risk Score Calculator</h1>

  <div class="form-group">
    <label for="gasType">Select Gas Type</label>
    <select id="gasType" onchange="setCriticalValues()">
      <option value="">--Select--</option>
      <option value="methane">Methane</option>
      <option value="ethane">Ethane</option>
      <option value="propane">Propane</option>
      <option value="custom">Custom</option>
    </select>
    <div class="note">Select a gas type to auto-fill critical values or choose Custom to enter manually.</div>
  </div>

  <div class="form-group">
    <label for="temperature">Pipeline Temperature (K)</label>
    <input type="number" id="temperature" step="0.01" placeholder="e.g., 300" min="0" />
  </div>

  <div class="form-group">
    <label for="pressure">Pipeline Pressure (MPa)</label>
    <input type="number" id="pressure" step="0.01" placeholder="e.g., 5" min="0" />
  </div>

  <div class="form-group">
    <label for="Tcrit">Critical Temperature (K)</label>
    <input type="number" id="Tcrit" step="0.01" placeholder="Auto-filled or enter value" min="0" />
  </div>

  <div class="form-group">
    <label for="Pcrit">Critical Pressure (MPa)</label>
    <input type="number" id="Pcrit" step="0.01" placeholder="Auto-filled or enter value" min="0" />
  </div>

  <button onclick="calculateRisk()">Calculate Risk</button>

  <div class="result" id="output" style="display:none;">
    <p id="riskScore"></p>
    <p id="riskPercent"></p>
  </div>

  <script>
    const gasData = {
      methane: { Tcrit: 280.9, Pcrit: 5.847 },
      ethane: { Tcrit: 289.0, Pcrit: 4.884 },
      propane: { Tcrit: 289.6, Pcrit: 2.456 }
    };

    function setCriticalValues() {
      const gas = document.getElementById("gasType").value;
      if (gas in gasData) {
        document.getElementById("Tcrit").value = gasData[gas].Tcrit;
        document.getElementById("Pcrit").value = gasData[gas].Pcrit;
        document.getElementById("Tcrit").disabled = true;
        document.getElementById("Pcrit").disabled = true;
      } else {
        document.getElementById("Tcrit").value = "";
        document.getElementById("Pcrit").value = "";
        document.getElementById("Tcrit").disabled = false;
        document.getElementById("Pcrit").disabled = false;
      }
      document.getElementById("output").style.display = "none";
    }

    function calculateRisk() {
      const T = parseFloat(document.getElementById("temperature").value);
      const P = parseFloat(document.getElementById("pressure").value);
      const Tcrit = parseFloat(document.getElementById("Tcrit").value);
      const Pcrit = parseFloat(document.getElementById("Pcrit").value);

      if (
        isNaN(T) || isNaN(P) || isNaN(Tcrit) || isNaN(Pcrit) ||
        T === 0 || P === 0 || Tcrit === 0 || Pcrit === 0
      ) {
        alert("Please enter all valid numerical values greater than zero.");
        return;
      }

      // Hydrate Risk Score Equation
      const R = (P / Pcrit) * (Tcrit / T) - 1;
      const riskPercent = Math.abs(R) * 100;

      document.getElementById("output").style.display = "block";
      document.getElementById("riskScore").innerHTML = `<strong>Hydrate Risk Score:</strong> ${R.toFixed(4)}`;
      document.getElementById("riskPercent").innerHTML = `<strong>Hydrate Risk Percentage:</strong> ${riskPercent.toFixed(2)}%`;
    }
  </script>

</body>
</html>
