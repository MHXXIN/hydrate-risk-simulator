<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hydrate Risk Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f3f6f9;
        }
        h2 {
            color: #333;
        }
        label, select, input {
            display: block;
            margin-bottom: 15px;
        }
        input, select {
            padding: 6px;
            width: 250px;
        }
        button {
            padding: 8px 16px;
            background-color: #0066cc;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result, #resultPercentage, #suggestions {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h2>Gas Hydrate Risk Predictor</h2>

<label for="gas_type">Select Gas Type:</label>
<select id="gas_type">
    <option value="Methane">Methane</option>
    <option value="Ethane">Ethane</option>
    <option value="Propane">Propane</option>
</select>

<label for="temperature">Temperature (K):</label>
<input type="number" id="temperature" placeholder="Enter temperature in Kelvin">

<label for="pressure">Pressure (kPa):</label>
<input type="number" id="pressure" placeholder="Enter pressure in kPa">

<label for="A">Constant A:</label>
<input type="number" id="A" placeholder="Enter constant A">

<label for="B">Constant B:</label>
<input type="number" id="B" placeholder="Enter constant B">

<button onclick="calculateRisk()">Calculate Risk</button>

<div id="result"></div>
<div id="resultPercentage"></div>
<div id="suggestions"></div>

<script>
    function calculateRisk() {
        const T = parseFloat(document.getElementById("temperature").value);
        const P = parseFloat(document.getElementById("pressure").value);
        const A = parseFloat(document.getElementById("A").value);
        const B = parseFloat(document.getElementById("B").value);
        const gas = document.getElementById("gas_type").value;

        if (isNaN(T) || isNaN(P) || isNaN(A) || isNaN(B)) {
            alert("Please enter valid numerical values for all fields.");
            return;
        }

        const lnP = (A / T) + B;
        const P_predicted = Math.exp(lnP);
        const R = P - P_predicted;
        const riskPercentage = (R / P) * 100;

        document.getElementById("result").innerHTML = `Risk of Hydrate Formation Score: ${R.toFixed(2)}`;
        document.getElementById("resultPercentage").innerHTML = `Risk of Hydrate Formation Percentage: ${riskPercentage.toFixed(2)}%`;

        let suggestions = "<strong>Suggestions:</strong><ul>";
        if (R > 0) {
            suggestions += `<li>Hydrate formation likely. Try increasing temperature or decreasing pressure.</li>`;
        } else {
            suggestions += `<li>Hydrate formation is unlikely under current conditions.</li>`;
        }
        suggestions += "</ul>";
        document.getElementById("suggestions").innerHTML = suggestions;
    }
</script>

</body>
</html>
